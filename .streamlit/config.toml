# Align first paint with streamlit_app/app.py injected skin to reduce FOUC on cold load
# (especially when opening deep links like /#analyze-metrics-anchor).

[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
enableStaticServing = true
